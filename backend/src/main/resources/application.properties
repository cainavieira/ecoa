spring.application.name=api

# Toda rota da api fica sob /api/v1 (endpoints.md)
server.servlet.context-path=/api/v1

# Endereço e senha do banco chegam por variável de ambiente (ADR-0018). Em
# desenvolvimento, vêm do backend/.env; em produção, do Compose.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${ECOA_DB_URL}
spring.datasource.username=${ECOA_DB_USUARIO}
spring.datasource.password=${ECOA_DB_SENHA}

# O esquema pertence às migrações (ADR-0005)
spring.jpa.hibernate.ddl-auto=validate
# Consulta só dentro do service (ADR-0005)
spring.jpa.open-in-view=false
# Dialeto fixo: sem ele, banco inacessível aparece como erro de dialeto, e não
# de conexão
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# A api nunca migra ao subir; o modo migrar e os testes ligam (ADR-0006)
spring.flyway.enabled=false

# Número com parte decimal em campo inteiro é recusado, e não cortado (UC-10 3b)
spring.jackson.deserialization.accept-float-as-int=false

# Log só de erro (RNF-16)
logging.level.root=error
